name: Codex Windows Sandbox Diagnostic
run-name: "Codex Windows Sandbox Diagnostic #${{ github.run_number }} - ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  push:
    branches:
      - feat/autonomous-engineering-complete-20261112
      - fix/autonomous-engineering-show-all-ollama-models-20261112
    paths:
      - .github/workflows/codex-windows-sandbox-diagnostic.yml
      - app/autonomous_engineering.py
      - app/autonomous_engineering_services.py
      - app/hardware.py
      - app/sandbox.py
      - pyproject.toml
      - scripts/autonomous_engineering_checkpoint_process.py
      - scripts/validate_autonomous_engineering_target_host.py
      - tests/test_autonomous_engineering_checkpoint_process.py
      - tests/test_autonomous_engineering_checkpoint_recovery.py
      - tests/test_autonomous_engineering_cycle.py
      - tests/test_hardware.py
      - tests/test_sandbox.py
      - .github/workflows/autonomous-codex-engineering.yml
      - .github/workflows/browser-e2e.yml
      - docs/operations/CODEX_AUTONOMOUS_ENGINEERING.md
      - docs/architecture/ADR-020-codex-adaptive-context.md
      - docs/ROADMAP_ACCEPTANCE.md
      - scripts/autonomous_engineering_codex_config.py
      - scripts/check_autonomous_agent.ps1
      - scripts/provision_autonomous_runner.ps1
      - scripts/check_autonomous_runner.ps1
      - scripts/check_autonomous_agent.ps1
      - app/static/autonomous-engineering.js
      - app/autonomous_engineering.py
      - app/autonomous_engineering_services.py
      - app/main.py
      - app/ollama.py
      - app/ollama_context.py
      - scripts/autonomous_engineering_progress.py
      - scripts/verify_ollama_context.ps1
      - tests/test_autonomous_engineering.py
      - tests/test_ollama_context.py
      - tests/test_ollama_model_metadata.py
      - tests/test_codex_smoke_diagnostics.py
      - tests/test_browser_e2e.py
      - docs/PROJECT_STATUS.md
      - docs/ENGINEERING_LOG.md
      - tests/test_autonomous_engineering_cycle.py
      - tests/test_codex_smoke_diagnostics.py
  workflow_dispatch:
    inputs:
      model:
        description: "Installed local Ollama model"
        required: false
        type: string
        default: ""
      context_length:
        description: "Optional manual context token count; blank selects a safe value automatically"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  cancel-stale-diagnostics:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older queued diagnostics for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $branch = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $uri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/workflows/codex-windows-sandbox-diagnostic.yml/runs?branch=$branch&per_page=100"
          try {
            $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get -TimeoutSec 15
            foreach ($run in @($response.workflow_runs)) {
              if ([int64]$run.run_number -ge [int64]$env:CURRENT_RUN_NUMBER) { continue }
              $shouldCancel = $run.status -eq "queued"
              if ($run.status -eq "in_progress") {
                try {
                  $jobsUri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)/jobs?per_page=100"
                  $jobResponse = Invoke-RestMethod -Uri $jobsUri -Headers $headers -Method Get -TimeoutSec 15
                  $sandboxJobs = @($jobResponse.jobs | Where-Object { $_.name -eq "sandbox-diagnostic" })
                  $activeSandbox = @($sandboxJobs | Where-Object { $_.status -eq "in_progress" }).Count -gt 0
                  $shouldCancel = -not $activeSandbox
                } catch {
                  Write-Warning "Could not inspect jobs for older run $($run.id): $($_.Exception.Message)"
                }
              }
              if ($shouldCancel) {
                $cancelUri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)/cancel"
                try {
                  Invoke-RestMethod -Uri $cancelUri -Headers $headers -Method Post -TimeoutSec 15 | Out-Null
                  Start-Sleep -Seconds 2
                  $afterCancel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)" -Headers $headers -Method Get -TimeoutSec 15
                  if ($afterCancel.status -ne "completed") {
                    $forceCancelUri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)/force-cancel"
                    Invoke-RestMethod -Uri $forceCancelUri -Headers $headers -Method Post -TimeoutSec 15 | Out-Null
                    Write-Host "Force-cancelled stale diagnostic run $($run.id) after normal cancellation remained pending."
                  } else {
                    Write-Host "Cancelled stale diagnostic run $($run.id) (run number $($run.run_number))."
                  }
                } catch {
                  Write-Warning "Could not cancel stale run $($run.id): $($_.Exception.Message)"
                }
              }
            }
          } catch {
            Write-Warning "Could not list diagnostic runs; continuing without cleanup: $($_.Exception.Message)"
          }

      - name: Cancel superseded CI runs for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $branch = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $workflowFiles = @("tests.yml", "browser-e2e.yml", "dependency-audit.yml")
          foreach ($workflowFile in $workflowFiles) {
            $workflow = [uri]::EscapeDataString($workflowFile)
            $uri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/workflows/$workflow/runs?branch=$branch&per_page=100"
            try {
              $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get -TimeoutSec 15
              foreach ($run in @($response.workflow_runs)) {
                if ($run.head_sha -eq $env:GITHUB_SHA) { continue }
                if ($run.status -notin @("queued", "in_progress")) { continue }
                # A stale diagnostic may finish after a newer push. Cancel only
                # runs whose commit is a strict ancestor of this diagnostic SHA.
                $compareUri = "https://api.github.com/repos/$env:GH_REPOSITORY/compare/$($run.head_sha)...$env:GITHUB_SHA"
                try {
                  $comparison = Invoke-RestMethod -Uri $compareUri -Headers $headers -Method Get -TimeoutSec 15
                } catch {
                  Write-Warning "Could not establish commit ancestry for $workflowFile run $($run.id); leaving it untouched: $($_.Exception.Message)"
                  continue
                }
                if ($comparison.status -ne "ahead" -or [int]$comparison.behind_by -ne 0 -or [int]$comparison.ahead_by -le 0) {
                  Write-Host "Keeping $workflowFile run $($run.id): its commit is not a strict ancestor of $env:GITHUB_SHA."
                  continue
                }
                $cancelUri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)/cancel"
                try {
                  Invoke-RestMethod -Uri $cancelUri -Headers $headers -Method Post -TimeoutSec 15 | Out-Null
                  Start-Sleep -Seconds 1
                  $afterCancel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)" -Headers $headers -Method Get -TimeoutSec 15
                  if ($afterCancel.status -ne "completed") {
                    $forceCancelUri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($run.id)/force-cancel"
                    Invoke-RestMethod -Uri $forceCancelUri -Headers $headers -Method Post -TimeoutSec 15 | Out-Null
                  }
                  Write-Host "Cancelled superseded $workflowFile run $($run.id) at $($run.head_sha)."
                } catch {
                  Write-Warning "Could not cancel superseded $workflowFile run $($run.id): $($_.Exception.Message)"
                }
              }
            } catch {
              Write-Warning "Could not list $workflowFile runs for this branch: $($_.Exception.Message)"
            }
          }

  sandbox-diagnostic:
    needs: cancel-stale-diagnostics
    concurrency:
      group: autonomous-local-engineering-${{ github.repository }}
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, ollama]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      AUTONOMOUS_ENGINEERING_MODEL: ${{ inputs.model || vars.AUTONOMOUS_ENGINEERING_MODEL || '' }}
      AUTONOMOUS_ENGINEERING_CONTEXT_LENGTH: ${{ inputs.context_length || (github.ref_name != 'fix/autonomous-engineering-show-all-ollama-models-20261112' && vars.AUTONOMOUS_ENGINEERING_CONTEXT_LENGTH) || '' }}
      CODEX_WINDOWS_SANDBOX_BACKEND: mxc
      CODEX_MODEL_REASONING_EFFORT: low
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Wait for the complete exact-head GitHub CI matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $required = @("tests", "browser-e2e", "dependency-audit")
          $deadline = (Get-Date).AddMinutes(35)
          $allGreen = $false
          while ((Get-Date) -lt $deadline) {
            $uri = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs?head_sha=$env:EXPECTED_HEAD_SHA&event=pull_request&per_page=100"
            $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get -TimeoutSec 20
            $runs = @($response.workflow_runs | Where-Object { $_.head_sha -eq $env:EXPECTED_HEAD_SHA })
            $allGreen = $true
            foreach ($name in $required) {
              $matching = @($runs | Where-Object { $_.name -eq $name } | Sort-Object created_at -Descending)
              if ($matching.Count -eq 0) {
                $allGreen = $false
                break
              }
              $latest = $matching[0]
              if ($latest.status -ne "completed") {
                $allGreen = $false
                break
              }
              if ($latest.conclusion -ne "success") {
                throw "Required exact-head workflow '$name' finished with conclusion '$($latest.conclusion)' for $env:EXPECTED_HEAD_SHA."
              }
            }
            if ($allGreen) { break }
            Start-Sleep -Seconds 15
          }
          if (-not $allGreen) {
            throw "The exact-head GitHub CI matrix did not become fully green before the target-host validation deadline."
          }
          Write-Host "All required GitHub workflows are green on exact head $env:EXPECTED_HEAD_SHA."

      - name: Prepare the same service-account runtime and verify target hardware
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner identity:"
          whoami
          $pythonPath = "C:\Program Files\Python311\python.exe"
          $pythonDirectory = Split-Path -Parent $pythonPath
          $scriptsPath = Join-Path $pythonDirectory "Scripts"
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
            throw "System-wide Python was not found: $pythonPath"
          }
          if (-not (Test-Path -LiteralPath $scriptsPath -PathType Container)) {
            throw "Python Scripts directory was not found: $scriptsPath"
          }

          $ollamaCommand = Get-Command ollama.exe -ErrorAction SilentlyContinue
          $ollamaPath = if ($ollamaCommand) { $ollamaCommand.Source } else { $null }
          if (-not $ollamaPath) {
            $ollamaProcess = Get-CimInstance Win32_Process -Filter "Name='ollama.exe'" -ErrorAction Stop |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_.ExecutablePath) } |
              Select-Object -First 1
            $ollamaPath = if ($ollamaProcess) { [string]$ollamaProcess.ExecutablePath } else { $null }
          }
          if ([string]::IsNullOrWhiteSpace($ollamaPath) -or -not (Test-Path -LiteralPath $ollamaPath -PathType Leaf)) {
            throw "Ollama executable was not found in PATH or among active ollama.exe processes."
          }
          $ollamaDirectory = Split-Path -Parent $ollamaPath

          $npm = Get-Command npm.cmd -ErrorAction Stop
          $npmPrefixOutput = & $npm.Source config get prefix 2>&1
          $npmPrefixExitCode = $LASTEXITCODE
          $npmPrefix = [string](@($npmPrefixOutput)[0])
          $npmPrefix = $npmPrefix.Trim()
          if ($npmPrefixExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($npmPrefix)) {
            throw "Could not determine the Runner service account's npm global prefix."
          }
          $env:PATH = "$pythonDirectory;$scriptsPath;$npmPrefix;$ollamaDirectory;$env:PATH"
          @($pythonDirectory, $scriptsPath, $npmPrefix, $ollamaDirectory) |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $requiredCodexVersion = "0.167.0"
          $codexCommand = Get-Command codex.cmd -ErrorAction SilentlyContinue
          $installedVersion = ""
          if ($codexCommand) {
            $versionOutput = & $codexCommand.Source --version 2>&1
            $versionExitCode = $LASTEXITCODE
            $installedVersion = (@($versionOutput) -join " ").Trim()
            if ($versionExitCode -ne 0) { $installedVersion = "" }
          }
          if ($installedVersion -notmatch [regex]::Escape($requiredCodexVersion)) {
            & $npm.Source install --global "@openai/codex@$requiredCodexVersion"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not install the pinned Codex CLI $requiredCodexVersion for the Runner service account."
            }
          }
          $codexCommand = Get-Command codex.cmd -ErrorAction Stop
          $codexVersionOutput = & $codexCommand.Source --version 2>&1
          $codexVersionExitCode = $LASTEXITCODE
          $codexVersion = (@($codexVersionOutput) -join " ").Trim()
          if ($codexVersionExitCode -ne 0 -or $codexVersion -notmatch [regex]::Escape($requiredCodexVersion)) {
            throw "Unexpected Codex CLI version under the Runner identity: '$codexVersion'."
          }
          & $pythonPath --version
          if ($LASTEXITCODE -ne 0) { throw "Python cannot execute under the Runner service identity." }
          & $ollamaPath --version
          if ($LASTEXITCODE -ne 0) { throw "Ollama CLI cannot execute under the Runner service identity." }
          Write-Host "npm executable: $($npm.Source)"
          Write-Host "Codex executable: $($codexCommand.Source)"
          Write-Host "Codex version: $codexVersion"
          Write-Host "Ollama executable: $ollamaPath"
          Write-Host "Ollama version:"
          & $ollamaPath --version

          $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          $processors = @(Get-CimInstance Win32_Processor -ErrorAction Stop)
          $operatingSystem = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          $videoControllers = @(Get-CimInstance Win32_VideoController -ErrorAction Stop)
          $cpuName = [string]$processors[0].Name
          $physicalCores = [int](($processors | Measure-Object -Property NumberOfCores -Sum).Sum)
          $logicalProcessors = [int](($processors | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum)
          $totalRamGiB = [math]::Round([double]$computer.TotalPhysicalMemory / [math]::Pow(1024, 3), 2)
          $gpuInventory = @($videoControllers | ForEach-Object {
            [pscustomobject]@{
              name = [string]$_.Name
              wmi_adapter_ram_bytes = if ($null -ne $_.AdapterRAM) { [int64]$_.AdapterRAM } else { $null }
              driver_version = [string]$_.DriverVersion
            }
          })
          $hardware = [pscustomobject]@{
            os_caption = [string]$operatingSystem.Caption
            os_version = [string]$operatingSystem.Version
            os_build = [string]$operatingSystem.BuildNumber
            cpu_name = $cpuName
            physical_cores = $physicalCores
            logical_processors = $logicalProcessors
            total_physical_ram_gib = $totalRamGiB
            gpu_inventory = $gpuInventory
            note = "WMI AdapterRAM on an integrated Intel GPU is not proof of dedicated VRAM; shared memory is reported separately by Windows GPU counters."
          }
          Write-Host "TARGET_HOST_HARDWARE_PROFILE:"
          $hardware | ConvertTo-Json -Depth 6 | Write-Host

          if ($cpuName -notmatch '(?i)i5-12400' -or $physicalCores -ne 6 -or $logicalProcessors -ne 12) {
            throw "Target CPU does not match the recorded Intel Core i5-12400 6-core/12-thread profile."
          }
          if ($totalRamGiB -lt 30 -or $totalRamGiB -gt 33) {
            throw "Target physical RAM $totalRamGiB GiB does not match the recorded 31.78 GiB / 32 GB class."
          }
          if (-not ($gpuInventory.name -match '(?i)Intel.*UHD.*730')) {
            throw "Target GPU does not match the recorded Intel UHD Graphics 730 profile."
          }
          $tags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 5 -MaximumRedirection 0
          if (@($tags.models | ForEach-Object { $_.name }) -notcontains $env:AUTONOMOUS_ENGINEERING_MODEL) {
            throw "Ollama model '$env:AUTONOMOUS_ENGINEERING_MODEL' is not installed."
          }
          Write-Host "Target hardware matches the recorded user system profile."
      - name: Run target-host ownership, concurrency, and recovery acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $systemPython = "C:\Program Files\Python311\python.exe"
          if (-not (Test-Path -LiteralPath $systemPython -PathType Leaf)) {
            throw "System-wide Python was not found: $systemPython"
          }
          & $systemPython scripts/validate_autonomous_engineering_target_host.py
          if ($LASTEXITCODE -ne 0) {
            throw "Target-host architecture acceptance failed."
          }
          Write-Host "TARGET_RUNNER_ARCHITECTURE_ACCEPTANCE_OK"

      - name: Run adaptive-context regression suite on the target Windows host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TEMP "codex-adaptive-context-tests"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "Could not create an isolated target-host test environment." }
          $testPython = Join-Path $venv "Scripts\python.exe"
          & $testPython -m pip install --disable-pip-version-check -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Could not install isolated test dependencies on the target host." }
          & $testPython -m pytest -q tests/test_ollama_context.py tests/test_ollama_model_metadata.py tests/test_codex_smoke_diagnostics.py tests/test_autonomous_engineering.py
          if ($LASTEXITCODE -ne 0) { throw "Target-host adaptive-context regression suite failed." }

      - name: Inventory installed Ollama models and capabilities
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10 -MaximumRedirection 0
          $inventory = foreach ($model in @($tags.models)) {
            if (-not $model.name) { continue }
            $details = $null
            $metadataError = $null
            try {
              $body = @{ model = [string]$model.name; verbose = $false } | ConvertTo-Json -Compress
              $details = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/show" -Method Post -Body $body -ContentType "application/json" -TimeoutSec 20 -MaximumRedirection 0
            } catch {
              $metadataError = $_.Exception.Message
            }
            $family = if ($details -and $details.details) { [string]$details.details.family } else { "" }
            $contextKey = if ($family) { "$family.context_length" } else { "" }
            $maximum = $null
            if ($contextKey -and $details.model_info) {
              $property = $details.model_info.PSObject.Properties[$contextKey]
              if ($property) { $maximum = $property.Value }
            }
            [pscustomobject]@{
              name = [string]$model.name
              size_bytes = $model.size
              family = $family
              maximum_context_tokens = $maximum
              capabilities = @($details.capabilities)
              supports_tools = (@($details.capabilities) -contains "tools")
              metadata_error = $metadataError
              is_current_selection = ([string]$model.name -eq $env:AUTONOMOUS_ENGINEERING_MODEL)
            }
          }
          Write-Host "Saved workflow model selection: $env:AUTONOMOUS_ENGINEERING_MODEL"
          Write-Host "Saved workflow context override: $env:AUTONOMOUS_ENGINEERING_CONTEXT_LENGTH"
          Write-Host "Installed Ollama model inventory:"
          $inventory | ConvertTo-Json -Depth 8 | Write-Host
          if (-not @($inventory).Count) { throw "Ollama reported no installed models." }

      - name: Verify the selected model's allocated Ollama context
        id: context_preflight
        # Select, persist, and verify a context bounded by model metadata and available memory.
        timeout-minutes: 12
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\verify_ollama_context.ps1" -Model "$env:AUTONOMOUS_ENGINEERING_MODEL"

      - name: Record actual Ollama CPU/GPU memory allocation
        if: steps.context_preflight.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/ps" -TimeoutSec 10 -MaximumRedirection 0
          $matches = @($runtime.models | Where-Object {
            $_ -and $_.name -and ([string]$_.name).Equals($env:AUTONOMOUS_ENGINEERING_MODEL, [System.StringComparison]::OrdinalIgnoreCase)
          })
          if ($matches.Count -ne 1) {
            throw "Expected exactly one loaded selected Ollama model when recording device allocation."
          }
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          $allocation = [pscustomobject]@{
            model = [string]$matches[0].name
            context_length = [int64]$matches[0].context_length
            model_size_bytes = if ($null -ne $matches[0].size) { [int64]$matches[0].size } else { $null }
            vram_size_bytes = if ($null -ne $matches[0].size_vram) { [int64]$matches[0].size_vram } else { $null }
            remaining_physical_ram_bytes = [int64]$os.FreePhysicalMemory * 1KB
          }
          Write-Host "OLLAMA_RUNTIME_DEVICE_ALLOCATION:"
          $allocation | ConvertTo-Json -Depth 4 | Write-Host
          if ($allocation.context_length -ne [int64]$env:AUTONOMOUS_ENGINEERING_CONTEXT_LENGTH -and
              -not [string]::IsNullOrWhiteSpace($env:AUTONOMOUS_ENGINEERING_CONTEXT_LENGTH)) {
            throw "Ollama runtime context does not match the explicitly requested context."
          }

      - name: Probe MXC and Codex exec_command under the Runner identity
        timeout-minutes: 25
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object System.Security.Principal.WindowsPrincipal($identity)
          if ($principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Diagnostic must run as the non-administrator Runner service identity."
          }
          $runnerProcess = Get-CimInstance Win32_Process -Filter "ProcessId=$PID"
          Write-Host "Runner PowerShell session ID: $($runnerProcess.SessionId)"
          Write-Host "USERPROFILE=$env:USERPROFILE"
          Write-Host "CODEX_HOME=$env:CODEX_HOME"
          $codexHome = if ($env:CODEX_HOME) { $env:CODEX_HOME } else { Join-Path $env:USERPROFILE ".codex" }
          $configPath = Join-Path $codexHome "config.toml"
          Write-Host "Effective Codex config path: $configPath"
          Write-Host "User config exists: $(Test-Path -LiteralPath $configPath -PathType Leaf)"
          $requirementsPath = Join-Path $env:ProgramData "OpenAI\Codex\requirements.toml"
          Write-Host "Managed requirements exist: $(Test-Path -LiteralPath $requirementsPath -PathType Leaf)"
          $probeOutput = & codex -c windows.sandbox=mxc sandbox --include-managed-config --permission-profile :workspace -- cmd.exe /d /c echo MXC_SERVICE_OK 2>&1
          $probeExitCode = $LASTEXITCODE
          $probeOutput | ForEach-Object { Write-Host $_ }
          Write-Host "MXC compatibility probe exit code: $probeExitCode"
          if ($probeExitCode -ne 0 -or (($probeOutput | Out-String) -notmatch "MXC_SERVICE_OK")) {
            throw "The official MXC compatibility probe failed under the Runner service identity."
          }
          $cmdProbeOutput = & codex -c windows.sandbox=mxc sandbox --include-managed-config --permission-profile :workspace -- cmd.exe /d /c python -c "print('MXC_CMD_PYTHON_OK')" 2>&1
          $cmdProbeExitCode = $LASTEXITCODE
          $cmdProbeOutput | ForEach-Object { Write-Host $_ }
          Write-Host "MXC cmd.exe plus Python probe exit code: $cmdProbeExitCode"
          if ($cmdProbeExitCode -ne 0 -or (($cmdProbeOutput | Out-String) -notmatch "MXC_CMD_PYTHON_OK")) {
            throw "MXC can start cmd.exe but cannot complete the direct Python child probe."
          }
          $prompt = Join-Path $env:RUNNER_TEMP "codex-windows-sandbox-smoke.md"
          $report = Join-Path $env:RUNNER_TEMP "codex-windows-sandbox-report.md"
          $evidence = Join-Path $env:RUNNER_TEMP "codex-windows-sandbox-evidence.json"
          $probeFileName = ".codex-sandbox-probe-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).tmp"
          $probePath = Join-Path $env:GITHUB_WORKSPACE $probeFileName
          if (Test-Path -LiteralPath $probePath) { throw "Workspace probe path already exists for this run attempt; refusing to overwrite it." }
          $promptText = @"
          Use the exec_command tool with shell set to the absolute executable C:\Windows\System32\cmd.exe and login set to false. Do not use the default PowerShell shell.
          Execute this single self-contained command verbatim:
          echo ok>$probeFileName && type $probeFileName && del $probeFileName && echo CODEX_WORKSPACE_SANDBOX_OK
          Set yield_time_ms to integer 10000 and sandbox_permissions to "use_default". Never request escalation or additional permissions. Do not inspect the repository or run unrelated commands. Call exec_command once only. If it returns a nonzero exit code or any error, do not retry, change the command, or print the success marker; stop and report failure. Only after the exact command succeeds, reply exactly: OLLAMA_PROVIDER_AND_SANDBOX_OK
          "@
          Set-Content -LiteralPath $prompt -Value $promptText -Encoding utf8
          Write-Host "Codex diagnostic reasoning effort: $env:CODEX_MODEL_REASONING_EFFORT"
          python scripts/autonomous_engineering_progress.py codex --run-id "$env:GITHUB_RUN_ID-sandbox-mxc" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --model "$env:AUTONOMOUS_ENGINEERING_MODEL" --prompt "$prompt" --report "$report" --require-command-output "CODEX_WORKSPACE_SANDBOX_OK" --events-report "$evidence" --require-command-fragment "$probeFileName" --require-command-fragment "echo" --require-command-fragment "type" --require-command-fragment "del"
          $smokeExitCode = $LASTEXITCODE
          Write-Host "Codex smoke exit code: $smokeExitCode"
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            $finalMessage = Get-Content -LiteralPath $report -Raw
            if (-not [string]::IsNullOrWhiteSpace($finalMessage)) {
              Write-Host "Codex final agent message:"
              Write-Host $finalMessage
            } else {
              Write-Host "Codex completed the tool smoke without a final text message; the command proof and completed turn are the acceptance criteria."
            }
          } else {
            Write-Host "Codex emitted no final text message; this is not required for the command-execution smoke."
          }
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) {
            throw "Codex did not produce JSONL command-execution evidence."
          }
          $smokeEvidence = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          Write-Host "Codex JSONL smoke evidence:"
          $smokeEvidence | ConvertTo-Json -Depth 8 | Write-Host
          if ($smokeExitCode -ne 0 -or -not $smokeEvidence.passed) {
            throw "MXC compatibility probe passed, but the actual Codex JSONL command-execution proof failed."
          }
          if (Test-Path -LiteralPath $probePath) {
            throw "Workspace probe file remains after the smoke test; cleanup was not verified."
          }
          Write-Host "CODEX_WINDOWS_MXC_SERVICE_SMOKE_OK"

      - name: Verify persistent Ollama context after Codex smoke
        if: always() && steps.context_preflight.outcome == 'success'
        timeout-minutes: 2
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\verify_ollama_context.ps1" -Model "$env:AUTONOMOUS_ENGINEERING_MODEL" -VerifyOnly
