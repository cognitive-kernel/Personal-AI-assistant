name: Autonomous engineering recovery

on:
  workflow_run:
    workflows: ["Autonomous local Ollama engineering"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-engineering-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

      - name: Check out trusted main recovery policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Classify failure and recover only eligible task executions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXECUTION_MODE: ${{ vars.AUTONOMOUS_ENGINEERING_MODE || 'continuous' }}
          PAUSED: ${{ vars.AUTONOMOUS_ENGINEERING_PAUSED || 'false' }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/autonomous_engineering_recovery.py
