name: Autonomous engineering recovery

on:
  workflow_run:
    workflows: ["Autonomous local Ollama engineering"]
    types: [completed]
    branches: [main]

permissions:
  actions: write

concurrency:
  group: autonomous-engineering-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.display_title, '[recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch one bounded recovery retry without Variables API access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXECUTION_MODE: ${{ vars.AUTONOMOUS_ENGINEERING_MODE || 'continuous' }}
          PAUSED: ${{ vars.AUTONOMOUS_ENGINEERING_PAUSED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXECUTION_MODE" != "continuous" ]]; then
            echo "Scheduled mode: automatic failure retry is disabled."
            exit 0
          fi
          if [[ "${PAUSED,,}" == "true" ]]; then
            echo "The owner has paused the queue; recovery will not dispatch another run."
            exit 0
          fi
          sleep 30
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/autonomous-codex-engineering.yml/dispatches"
          payload = {
              "ref": "main",
              "inputs": {
                  "manual_task": "",
                  "recovery_retry": "true",
              },
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 201, 202, 204):
                      raise SystemExit(f"Unexpected workflow dispatch status: {response.status}")
          except urllib.error.HTTPError as exc:
              detail = exc.read(4000).decode("utf-8", errors="replace")
              raise SystemExit(f"Workflow recovery dispatch failed: HTTP {exc.code}: {detail}") from exc
          print("Dispatched exactly one recovery retry. A failed recovery run is not retried again automatically.")
          PY
