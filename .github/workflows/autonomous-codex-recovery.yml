name: Autonomous engineering recovery

on:
  workflow_run:
    workflows: ["Autonomous local Ollama engineering"]
    types: [completed]
    branches: [main]

permissions:
  actions: write

concurrency:
  group: autonomous-engineering-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry the unaccepted task or pause after repeated failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read(100_000)
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          def variable(name, default=""):
              result = request("GET", f"/actions/variables/{name}")
              return str(result.get("value", default)) if result else default

          def set_variable(name, value):
              payload = {"name": name, "value": str(value)}
              result = request("PATCH", f"/actions/variables/{name}", payload)
              if result is None:
                  request("POST", "/actions/variables", payload)

          if variable("AUTONOMOUS_ENGINEERING_MODE", "continuous") != "continuous":
              print("Scheduled mode: automatic failure retry is not enabled.")
              raise SystemExit(0)
          if variable("AUTONOMOUS_ENGINEERING_PAUSED", "false").lower() == "true":
              print("The owner has paused the queue; recovery will not dispatch another run.")
              raise SystemExit(0)

          try:
              streak = max(0, int(variable("AUTONOMOUS_ENGINEERING_FAILURE_STREAK", "0")))
          except ValueError:
              streak = 0

          streak += 1
          set_variable("AUTONOMOUS_ENGINEERING_FAILURE_STREAK", streak)
          delay_seconds = min(240, 30 * (2 ** min(streak - 1, 3)))
          print(f"Cycle failed {streak} consecutive time(s); retrying after {delay_seconds} seconds.")
          import time
          time.sleep(delay_seconds)

          pending_task = variable("AUTONOMOUS_ENGINEERING_PENDING_TASK", "")
          request("POST", "/actions/workflows/autonomous-codex-engineering.yml/dispatches", {
              "ref": "main",
              "inputs": {"manual_task": pending_task},
          })
          print(f"Dispatched recovery cycle {streak} from the last accepted main checkpoint.")
          PY
