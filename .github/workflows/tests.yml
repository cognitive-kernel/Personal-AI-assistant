name: tests
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  push:
    branches: [main, feat/autonomous-engineering-complete-20261112]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate portable bootstrap shell syntax
        run: sh -n bootstrap.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Test Ollama context selection, model metadata, and Codex provider config
        run: python -m pytest -q tests/test_ollama_context.py tests/test_ollama_model_metadata.py tests/test_codex_smoke_diagnostics.py
      - name: Run focused checkpoint ownership and concurrency regressions
        run: python -m pytest -vv tests/test_autonomous_engineering_cycle.py -k "checkpoint or repository_execution_lock"
      - name: Run test suite
        run: pytest -vv --durations=25 -o faulthandler_timeout=60
      - name: Verify generated learning artifacts
        run: python scripts/generate_learning_artifacts.py --check
      - name: Validate repository-local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Enforce no module-time Python import cycles
        run: python scripts/check_import_cycles.py --fail-on-cycle
      - name: Run deterministic lexical retrieval benchmark
        run: python scripts/evaluate_experience_retrieval.py --lexical-only
      - name: Run fail-closed claim-to-test coverage benchmark
        run: python scripts/run_knowledge_acceptance_eval.py

  windows-full-suite:
    name: Full test suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run complete test suite on Windows
        run: python -m pytest -vv --durations=25 -o faulthandler_timeout=60

  windows-storage-regressions:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Windows launcher virtual-environment startup regressions
        run: >-
          python -m pytest -q
          tests/test_core.py
          -k "startup_bootstrap or managed_env or startup_handoff"
      - name: Verify PowerShell-to-Python Ollama context selection through an explicit file
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE "app\ollama_context.py"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw "Shared Ollama context selector is missing: $helper" }
          $payload = @{
            model_info = @{
              "llama.context_length" = 131072
              "llama.block_count" = 32
              "llama.attention.head_count_kv" = 8
              "llama.attention.key_length" = 128
              "llama.attention.value_length" = 128
            }
            architecture = "llama"
            model_weight_bytes = 5368709120
            available_memory_bytes = 21474836480
            requested_context_tokens = 100000
          } | ConvertTo-Json -Depth 10 -Compress
          $inputFile = Join-Path $env:TEMP ("ollama-context-" + [guid]::NewGuid().ToString("N") + ".json")
          try {
            [System.IO.File]::WriteAllText($inputFile, $payload, [System.Text.UTF8Encoding]::new($false))
            $selectionOutput = & python $helper --input-file $inputFile
            if ($LASTEXITCODE -ne 0) { throw "Explicit-file context selection failed: $($selectionOutput -join ' ')" }
            $selection = ($selectionOutput -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
            if ([int64]$selection.selected_context_tokens -ne [int64]$selection.hardware_maximum_context_tokens) {
              throw "Selected context did not match the live hardware-safe ceiling '$($selection.hardware_maximum_context_tokens)'."
            }
            if ([int64]$selection.selected_context_tokens -le 0) {
              throw "The selected context must be positive."
            }
            if ([int64]$selection.selected_context_tokens -gt [int64]$selection.requested_context_tokens) {
              throw "Selected context exceeded the requested context."
            }
            if ([int64]$selection.selected_context_tokens -gt [int64]$selection.maximum_context_tokens) {
              throw "Selected context exceeded the model metadata maximum."
            }
          } finally {
            if (Test-Path -LiteralPath $inputFile) { Remove-Item -LiteralPath $inputFile -Force }
          }
          Write-Host "PowerShell-to-Python explicit-file context bridge passed."
      - name: Verify Windows command and Codex process-tree ownership
        run: >-
          python -m pytest -vv
          tests/test_autonomous_engineering_command_runner.py
          tests/test_autonomous_engineering_process_job.py

      - name: Run real checkpoint watcher startup, stop, and recovery on Windows
        run: >-
          python -m pytest -q
          tests/test_autonomous_engineering_cycle.py
          tests/test_autonomous_engineering_checkpoint_recovery.py
          -k real_process
      - name: Run checkpoint ownership and recovery fault injection on Windows
        run: >-
          python -m pytest -q
          tests/test_autonomous_engineering_checkpoint_process.py
          tests/test_autonomous_engineering_execution_lock.py
          tests/test_autonomous_engineering_checkpoint_recovery.py
          tests/test_autonomous_engineering_state_lock.py
          tests/test_autonomous_engineering_pending_task_state.py
          tests/test_autonomous_engineering_pending_pr_state.py
          -k "not real_process"
      - name: Verify repository lock exclusion across Windows processes
        run: python -m pytest -q tests/test_autonomous_engineering_cycle.py -k repository_execution_lock
      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath scripts -File -Recurse | Where-Object { $_.Extension -in @(".ps1", ".psm1") }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell scripts/modules successfully."

      - name: Verify Windows PowerShell 5.1 with inherited PowerShell 7 module paths
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:WINDIR "System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) { throw "Windows PowerShell 5.1 executable was not found." }
          $repo = $env:GITHUB_WORKSPACE.Replace("'", "''")
          $modulePaths = @(
            (Join-Path $env:USERPROFILE "Documents\WindowsPowerShell\Modules"),
            (Join-Path $env:USERPROFILE "Documents\PowerShell\Modules"),
            (Join-Path $env:ProgramFiles "WindowsPowerShell\Modules"),
            (Join-Path $env:ProgramFiles "PowerShell\Modules"),
            (Join-Path $env:ProgramFiles "PowerShell\7\Modules"),
            (Join-Path $env:WINDIR "System32\WindowsPowerShell\v1.0\Modules")
          )
          $env:PSModulePath = $modulePaths -join [IO.Path]::PathSeparator
          $probe = @"
          `$ErrorActionPreference = "Stop"
          if (`$PSVersionTable.PSEdition -ne "Desktop") { throw "The probe must run under Windows PowerShell 5.1." }
          Import-Module '$repo\scripts\AutonomousWindowsIdentity.psm1' -Force -ErrorAction Stop
          Import-Module '$repo\scripts\AutonomousStateBrokerInstall.psm1' -Force -ErrorAction Stop
          if (-not (Test-AutonomousDotNetFramework48)) { throw "The Windows runner must expose .NET Framework 4.8 or later." }
          if (-not (Get-Command Get-Acl -ErrorAction SilentlyContinue)) { throw "Get-Acl was not imported." }
          if (-not (Get-Command Set-Acl -ErrorAction SilentlyContinue)) { throw "Set-Acl was not imported." }
          Write-Output "Windows PowerShell 5.1 security module import passed with inherited PowerShell 7 paths."
          "@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($probe))
          & $windowsPowerShell -NoProfile -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 rejected the inherited PowerShell 7 module-path probe." }

      - name: Verify PowerShell Core broker modules and active-host relaunch
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -ne "Core") {
            throw "This CI probe must run under a PowerShell Core runtime."
          }
          $activeHost = [string](Get-Process -Id $PID -ErrorAction Stop).Path
          if ([string]::IsNullOrWhiteSpace($activeHost) -or -not (Test-Path -LiteralPath $activeHost -PathType Leaf)) {
            throw "The active PowerShell Core executable could not be resolved."
          }
          $modules = @(
            "AutonomousWindowsIdentity.psm1",
            "AutonomousWindowsPaths.psm1",
            "AutonomousStateBroker.psm1",
            "AutonomousStateBrokerInstall.psm1"
          )
          foreach ($module in $modules) {
            Import-Module (Join-Path $env:GITHUB_WORKSPACE "scripts\\$module") -Force -ErrorAction Stop
          }
          if (-not (Get-Command Get-Acl -ErrorAction SilentlyContinue)) { throw "Get-Acl is unavailable under PowerShell Core." }
          if (-not (Get-Command Set-Acl -ErrorAction SilentlyContinue)) { throw "Set-Acl is unavailable under PowerShell Core." }
          if (-not (Test-AutonomousDotNetFramework48)) {
            throw "The Windows runner must expose the .NET Framework 4.8 runtime capability."
          }
          $probe = '$PSVersionTable.PSEdition + "|" + $PSVersionTable.PSVersion.ToString()'
          $childVersion = & $activeHost -NoLogo -NoProfile -NonInteractive -Command $probe
          $expectedChildVersion = "Core|" + $PSVersionTable.PSVersion.ToString()
          if ($LASTEXITCODE -ne 0 -or $childVersion -ne $expectedChildVersion) {
            throw "The active PowerShell Core host did not start a same-engine child process."
          }
          Write-Host "PowerShell Core broker module imports and active-host child launch passed: $childVersion"

      - name: Set up pinned .NET SDK for broker packaging
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100

      - name: Build and stage the Windows machine state broker
        shell: pwsh
        working-directory: scripts
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path (Get-Location) "AutonomousStateBrokerService.csproj"
          $packageRoot = Join-Path (Get-Location) "bin"
          $buildRoot = Join-Path $env:RUNNER_TEMP "state-broker-build"
          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          dotnet --info
          dotnet build $project --configuration Release --output $buildRoot -p:Deterministic=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) {
            throw "The Windows state broker did not build against the pinned .NET Framework reference package."
          }

          $freshExe = Join-Path $buildRoot "PersonalAIAssistant.StateBroker.exe"
          if (-not (Test-Path -LiteralPath $freshExe -PathType Leaf)) {
            throw "The CI build did not produce PersonalAIAssistant.StateBroker.exe."
          }
          $freshHash = (Get-FileHash -LiteralPath $freshExe -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          $packagedExe = Join-Path $packageRoot "PersonalAIAssistant.StateBroker.exe"
          $hashFile = $packagedExe + ".sha256"

          if (Test-Path -LiteralPath $packagedExe -PathType Leaf) {
            if (-not (Test-Path -LiteralPath $hashFile -PathType Leaf)) {
              throw "The committed broker executable has no SHA-256 manifest."
            }
            $expectedHash = (Get-Content -LiteralPath $hashFile -Raw -ErrorAction Stop).Trim().ToLowerInvariant()
            $committedHash = (Get-FileHash -LiteralPath $packagedExe -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($expectedHash -notmatch '^[0-9a-f]{64}$' -or $committedHash -ne $expectedHash) {
              throw "The committed broker executable does not match its SHA-256 manifest."
            }
            if ($freshHash -ne $committedHash) {
              throw "The fresh deterministic broker build differs from the committed executable."
            }
          } else {
            Copy-Item -LiteralPath $freshExe -Destination $packagedExe -ErrorAction Stop
            [System.IO.File]::WriteAllText($hashFile, $freshHash, [Text.Encoding]::ASCII)
            Write-Host "No committed broker package exists yet; staged the freshly built, hash-verified CI package."
          }

          $finalHash = (Get-FileHash -LiteralPath $packagedExe -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          $manifestHash = (Get-Content -LiteralPath $hashFile -Raw -ErrorAction Stop).Trim().ToLowerInvariant()
          if ($finalHash -ne $manifestHash -or $finalHash -ne $freshHash) {
            throw "The staged broker package failed final deterministic SHA-256 verification."
          }
          Write-Host "Broker package verified: $finalHash"

      - name: Upload the prebuilt Windows state broker package
        uses: actions/upload-artifact@v4
        with:
          name: windows-state-broker-package
          path: |
            scripts/bin/PersonalAIAssistant.StateBroker.exe
            scripts/bin/PersonalAIAssistant.StateBroker.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Attest the Windows state broker package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: scripts/bin/PersonalAIAssistant.StateBroker.exe

      - name: Exercise recursive protected state ACLs on Windows
        shell: pwsh
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\scripts\AutonomousWindowsIdentity.psm1" -Force
          $root = Join-Path $env:RUNNER_TEMP ("autonomous-state-acl-" + [guid]::NewGuid().ToString("N"))
          $nested = Join-Path $root "nested"
          New-Item -ItemType Directory -Path $nested -Force | Out-Null
          $file = Join-Path $nested "existing-state.json"
          [System.IO.File]::WriteAllText($file, '{"preserve":true}')
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $brokerSid = "S-1-5-19"
          try {
            $acl = Get-Acl -LiteralPath $root
            $legacy = [Security.AccessControl.FileSystemAccessRule]::new(
              "BUILTIN\Users",
              [Security.AccessControl.FileSystemRights]::FullControl,
              [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [Security.AccessControl.InheritanceFlags]::ObjectInherit,
              [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow
            )
            $acl.AddAccessRule($legacy)
            Set-Acl -LiteralPath $root -AclObject $acl
            Set-AutonomousDirectoryTreeAcl -Path $root -ModifySids @($currentSid, $brokerSid) -OwnerSid $brokerSid -InstallerSid $currentSid

            foreach ($itemPath in @($root, $nested, $file)) {
              $verified = Get-Acl -LiteralPath $itemPath
              $ownerSid = ([Security.Principal.NTAccount]$verified.Owner).Translate([Security.Principal.SecurityIdentifier]).Value
              if ($ownerSid -ne $brokerSid) { throw "State owner mismatch on $($itemPath): $ownerSid" }
              foreach ($rule in $verified.Access) {
                $sid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
                if ($sid -notin @($currentSid, $brokerSid)) { throw "Unexpected state ACL principal on $($itemPath): $sid" }
              }
            }
            if ([System.IO.File]::ReadAllText($file) -ne '{"preserve":true}') {
              throw "Existing state file contents changed during ACL provisioning."
            }
          } finally {
            if (Test-Path -LiteralPath $root) {
              & icacls.exe $root /grant:r "*$($currentSid):(OI)(CI)F" /T /C /Q | Out-Null
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Recursive state ACL reset, owner transfer, and existing-data preservation passed."

          $unsafeRoot = Join-Path $env:RUNNER_TEMP ("autonomous-state-reparse-" + [guid]::NewGuid().ToString("N"))
          $outside = Join-Path $env:RUNNER_TEMP ("autonomous-state-outside-" + [guid]::NewGuid().ToString("N"))
          $junction = Join-Path $unsafeRoot "outside-link"
          New-Item -ItemType Directory -Path $unsafeRoot, $outside -Force | Out-Null
          try {
            $rootAclBefore = Get-Acl -LiteralPath $unsafeRoot
            $outsideAclBefore = Get-Acl -LiteralPath $outside
            $rootOwnerBefore = ([Security.Principal.NTAccount]$rootAclBefore.Owner).Translate([Security.Principal.SecurityIdentifier]).Value
            $outsideOwnerBefore = ([Security.Principal.NTAccount]$outsideAclBefore.Owner).Translate([Security.Principal.SecurityIdentifier]).Value
            New-Item -ItemType Junction -Path $junction -Target $outside -ErrorAction Stop | Out-Null
            $reparseRejected = $false
            try {
              Set-AutonomousDirectoryTreeAcl -Path $unsafeRoot -ModifySids @($currentSid, $brokerSid) -OwnerSid $brokerSid -InstallerSid $currentSid
            } catch {
              if ($_.Exception.Message -like "*reparse point*") { $reparseRejected = $true } else { throw }
            }
            if (-not $reparseRejected) { throw "A state tree containing a junction was not rejected." }
            $rootAclAfter = Get-Acl -LiteralPath $unsafeRoot
            $outsideAclAfter = Get-Acl -LiteralPath $outside
            $rootOwnerAfter = ([Security.Principal.NTAccount]$rootAclAfter.Owner).Translate([Security.Principal.SecurityIdentifier]).Value
            $outsideOwnerAfter = ([Security.Principal.NTAccount]$outsideAclAfter.Owner).Translate([Security.Principal.SecurityIdentifier]).Value
            if ($rootOwnerAfter -ne $rootOwnerBefore -or $outsideOwnerAfter -ne $outsideOwnerBefore) {
              throw "ACL preflight changed ownership before rejecting the reparse point."
            }
          } finally {
            if (Test-Path -LiteralPath $junction) { Remove-Item -LiteralPath $junction -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $unsafeRoot) { Remove-Item -LiteralPath $unsafeRoot -Recurse -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $outside) { Remove-Item -LiteralPath $outside -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "Reparse-point rejection completed before any ownership or ACL changes."

          $rollbackRoot = Join-Path $env:RUNNER_TEMP ("autonomous-state-acl-rollback-" + [guid]::NewGuid().ToString("N"))
          $rollbackNested = Join-Path $rollbackRoot "nested"
          New-Item -ItemType Directory -Path $rollbackNested -Force | Out-Null
          $rollbackFile = Join-Path $rollbackNested "preserved.json"
          [System.IO.File]::WriteAllText($rollbackFile, '{"rollback":true}')
          $rollbackPaths = @($rollbackRoot, $rollbackNested, $rollbackFile)
          $originalDescriptors = @{}
          foreach ($path in $rollbackPaths) {
            $originalDescriptors[$path] = (Get-Acl -LiteralPath $path).Sddl
          }
          try {
            $aclSnapshot = Set-AutonomousDirectoryTreeAcl -Path $rollbackRoot -ModifySids @($brokerSid) -OwnerSid $brokerSid -InstallerSid $currentSid -PassThru
            if ($null -eq $aclSnapshot -or @($aclSnapshot.Entries).Count -ne 3) {
              throw "The ACL transaction did not return a complete rollback journal."
            }
            Restore-AutonomousDirectoryTreeAcl -Snapshot $aclSnapshot
            foreach ($path in $rollbackPaths) {
              $restoredDescriptor = (Get-Acl -LiteralPath $path).Sddl
              if ($restoredDescriptor -ne $originalDescriptors[$path]) {
                throw "The original ACL descriptor was not restored for $path."
              }
            }
            if ([System.IO.File]::ReadAllText($rollbackFile) -ne '{"rollback":true}') {
              throw "ACL rollback changed existing file contents."
            }
          } finally {
            if (Test-Path -LiteralPath $rollbackRoot) {
              & takeown.exe /F $rollbackRoot /R /D Y | Out-Null
              & icacls.exe $rollbackRoot /grant:r "*$($currentSid):(OI)(CI)F" /T /C /Q | Out-Null
              Remove-Item -LiteralPath $rollbackRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Transactional ACL snapshot and exact rollback passed."

      - name: Exercise the live LocalService broker and Python named-pipe client
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/test_autonomous_state_broker_service.ps1")

      - name: Exercise the packaged broker under Windows PowerShell Desktop
        shell: powershell
        run: |
          $activeHost = [string](Get-Process -Id $PID -ErrorAction Stop).Path
          if (-not (Test-Path -LiteralPath $activeHost -PathType Leaf)) {
            throw "Windows PowerShell Desktop did not expose its active executable path."
          }
          $childEdition = & $activeHost -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSEdition'
          if ($LASTEXITCODE -ne 0 -or $childEdition -notmatch "Desktop") {
            throw "Windows PowerShell Desktop could not relaunch its own executable."
          }
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/test_autonomous_state_broker_service.ps1")

      - name: Test shared Ollama runtime API contract
        shell: pwsh
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\scripts\AutonomousOllamaRuntime.psm1" -Force
          $catalog = @(ConvertFrom-AutonomousOllamaTagsResponse -Response ([pscustomobject]@{
            models = @(
              [pscustomobject]@{ name = "gpt-oss:20b" },
              [pscustomobject]@{ name = "qwen2.5:7b" }
            )
          }))
          if ($catalog.Count -ne 2) { throw "Ollama model catalog normalization failed." }
          if (-not (Test-AutonomousOllamaModelInstalled -Model "gpt-oss:20b" -Catalog $catalog)) {
            throw "Installed model lookup failed."
          }
          foreach ($invalid in @(
            [pscustomobject]@{},
            [pscustomobject]@{ models = @([pscustomobject]@{ name = "" }) }
          )) {
            $rejected = $false
            try { $null = ConvertFrom-AutonomousOllamaTagsResponse -Response $invalid } catch { $rejected = $true }
            if (-not $rejected) { throw "Malformed Ollama catalog was accepted." }
          }
          Write-Host "Ollama API catalog contract passed."

      - name: Verify Windows account identity portability
        shell: pwsh
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\scripts\AutonomousWindowsIdentity.psm1" -Force
          Import-Module "$env:GITHUB_WORKSPACE\scripts\AutonomousWindowsPaths.psm1" -Force
          $local = ConvertTo-AutonomousWindowsAccountName -AccountName "runner-example"
          $dotLocal = ConvertTo-AutonomousWindowsAccountName -AccountName ".\app-example"
          $domain = ConvertTo-AutonomousWindowsAccountName -AccountName "CONTOSO\runner-example"
          $upn = ConvertTo-AutonomousWindowsAccountName -AccountName "runner@example.invalid"
          $spacedLocal = ConvertTo-AutonomousWindowsAccountName -AccountName "runner service"
          $unicodeLocal = ConvertTo-AutonomousWindowsAccountName -AccountName "runner-é"

          $currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $currentIdentityName = $currentIdentity.Name
          $currentLocalName = Get-AutonomousLocalAccountName -AccountName $currentIdentityName
          if ($null -ne $currentLocalName) {
            $dotLocalSid = Get-AutonomousWindowsAccountSid -AccountName (".\\" + $currentLocalName)
            if ($dotLocalSid -ne $currentIdentity.User.Value) {
              throw "Dot-local service account SID resolution did not match the current local identity."
            }
          }

          if ($local -ne "$env:COMPUTERNAME\runner-example") { throw "Unqualified accounts must resolve to the current machine." }
          if ($dotLocal -ne "$env:COMPUTERNAME\app-example") { throw "Dot-local accounts must resolve to the current machine." }
          if ($domain -ne "CONTOSO\runner-example") { throw "Domain-qualified account names must be preserved." }
          if ($upn -ne "runner@example.invalid") { throw "UPN account names must be preserved." }
          if ($spacedLocal -ne "$env:COMPUTERNAME\runner service") { throw "Valid local names with spaces must be preserved." }
          if ($unicodeLocal -ne "$env:COMPUTERNAME\runner-é") { throw "Valid Unicode local names must be preserved." }
          if ((Get-AutonomousLocalAccountName -AccountName $local) -ne "runner-example") { throw "Local account detection failed." }
          if ($null -ne (Get-AutonomousLocalAccountName -AccountName $domain)) { throw "Domain accounts must not be classified as local." }
          Write-Host "Local, dot-local, domain-qualified, and UPN account identity normalization passed."
          $defaultState = Resolve-AutonomousStateDirectory -ConfiguredPath $null -ProgramDataPath $env:ProgramData
          $expectedDefault = [System.IO.Path]::GetFullPath((Join-Path $env:ProgramData "PersonalAIAssistant\autonomous-engineering"))
          if ($defaultState -ne $expectedDefault) { throw "Default state directory does not match the shared ProgramData contract." }
          $customState = Resolve-AutonomousStateDirectory -ConfiguredPath "%TEMP%\autonomous-state-probe" -ProgramDataPath $env:ProgramData
          if ($customState -ne [System.IO.Path]::GetFullPath((Join-Path $env:TEMP "autonomous-state-probe"))) { throw "Configured shared state directory was not expanded consistently." }
          $relativePathRejected = $false
          try { $null = Resolve-AutonomousStateDirectory -ConfiguredPath "relative-state" -ProgramDataPath $env:ProgramData } catch { $relativePathRejected = $true }
          if (-not $relativePathRejected) { throw "Relative shared state paths must fail closed." }
          Write-Host "Default, configured, environment-expanded, and relative state path contracts passed."
          $aclProbe = Join-Path $env:TEMP ("autonomous-acl-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $aclProbe | Out-Null
          try {
            $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            Set-AutonomousDirectoryAcl -Path $aclProbe -RunnerSid $runnerSid -AdditionalModifySid "S-1-5-19"
            $allowedSids = @($runnerSid, "S-1-5-19")
            $actualSids = @((Get-Acl -LiteralPath $aclProbe).Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value } | Select-Object -Unique)
            if ($actualSids.Count -ne $allowedSids.Count -or @($actualSids | Where-Object { $_ -notin $allowedSids }).Count -gt 0) {
              throw "The generated ACL contains missing or unexpected principals: $($actualSids -join ', ')."
            }
            Write-Host "SID-scoped directory ACL grants passed without fixed user/group names."
          } finally {
            Remove-Item -LiteralPath $aclProbe -Recurse -Force -ErrorAction SilentlyContinue
          }
          python -m pytest -q tests/test_autonomous_engineering_windows_portability.py

      - name: Test SQLite migration, restore, and staging cleanup on Windows
        run: >-
          python -m pytest -q
          tests/test_schema_registry.py::test_observed_legacy_learning_schema_migrates_with_backup_and_row_preservation
          tests/test_schema_registry.py::test_legacy_learning_migration_failure_preserves_original_database_bytes
          tests/test_schema_registry.py::test_application_database_initializer_migrates_observed_legacy_learning_store
          tests/test_schema_registry.py::test_restore_backup_requires_opt_in_to_replace_and_restores_verified_file
          tests/test_storage_routes.py::test_restore_staging_cleanup_previews_and_deletes_only_old_verified_snapshots

  commit-broker-package:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: windows-storage-regressions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-state-broker-package
          path: ${{ runner.temp }}/state-broker-package
      - name: Commit the reproducible broker package to this PR branch
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          artifact_root="${{ runner.temp }}/state-broker-package"
          exe="PersonalAIAssistant.StateBroker.exe"
          manifest="${exe}.sha256"
          expected="$(tr -d '\r\n' < "$artifact_root/$manifest")"
          actual="$(sha256sum "$artifact_root/$exe" | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "Downloaded broker artifact does not match its SHA-256 manifest." >&2
            exit 1
          fi
          mkdir -p scripts/bin
          if [[ -f "scripts/bin/$exe" && -f "scripts/bin/$manifest" ]] &&
             cmp -s "$artifact_root/$exe" "scripts/bin/$exe" &&
             cmp -s "$artifact_root/$manifest" "scripts/bin/$manifest"; then
            echo "The reproducible broker package is already committed; no branch update is needed."
            exit 0
          fi
          install -m 0644 "$artifact_root/$exe" "scripts/bin/$exe"
          install -m 0644 "$artifact_root/$manifest" "scripts/bin/$manifest"
          git add "scripts/bin/$exe" "scripts/bin/$manifest"
          if git diff --cached --quiet; then
            echo "No broker package changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add reproducible Windows state broker package"
          git push origin "HEAD:refs/heads/$PR_HEAD_REF"

  runtime-bootstrap:
    name: Managed Python bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap and validate managed Python on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\bootstrap.ps1 -RuntimeOnly
      - name: Bootstrap and validate managed Python on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --runtime-only
