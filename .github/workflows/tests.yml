name: tests
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/autonomous-engineering-complete-20261112]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Test Ollama context selection, model metadata, and Codex provider config
        run: python -m pytest -q tests/test_ollama_context.py tests/test_ollama_model_metadata.py tests/test_codex_smoke_diagnostics.py
      - name: Run focused checkpoint ownership and concurrency regressions
        run: python -m pytest -vv tests/test_autonomous_engineering_cycle.py -k "checkpoint or repository_execution_lock"
      - name: Run test suite
        run: pytest -vv --durations=25 -o faulthandler_timeout=60
      - name: Verify generated learning artifacts
        run: python scripts/generate_learning_artifacts.py --check
      - name: Validate repository-local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Enforce no module-time Python import cycles
        run: python scripts/check_import_cycles.py --fail-on-cycle
      - name: Run deterministic lexical retrieval benchmark
        run: python scripts/evaluate_experience_retrieval.py --lexical-only
      - name: Run fail-closed claim-to-test coverage benchmark
        run: python scripts/run_knowledge_acceptance_eval.py

  automation-python-runtime-compatibility:
    name: automation Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11.9"
            runner: ubuntu-24.04
          - python-version: "3.14.6"
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test Autonomous Engineering, hardware, and Ollama compatibility
        run: >-
          python -m pytest -q
          tests/test_autonomous_engineering.py
          tests/test_autonomous_engineering_cycle.py
          tests/test_autonomous_engineering_checkpoint_process.py
          tests/test_autonomous_engineering_checkpoint_recovery.py
          tests/test_autonomous_engineering_execution_lock.py
          tests/test_autonomous_engineering_pending_pr_state.py
          tests/test_autonomous_engineering_pending_task.py
          tests/test_autonomous_engineering_pending_task_state.py
          tests/test_autonomous_engineering_state_lock.py
          tests/test_autonomous_engineering_module_boundaries.py
          tests/test_hardware.py
          tests/test_ollama_context.py
          tests/test_ollama_model_metadata.py
          tests/test_codex_smoke_diagnostics.py

  windows-codex-cli-runtime-compatibility:
    name: Windows Node 26 / Codex ${{ matrix.codex-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        codex-version: ["0.167.0", "0.167.2"]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: false
          package-manager-cache: false
      - name: Install the target Codex CLI release
        env:
          CODEX_VERSION: ${{ matrix.codex-version }}
        run: npm install --global "@openai/codex@${env:CODEX_VERSION}"
      - name: Verify the target Node, npm, and Codex runtime
        env:
          CODEX_VERSION: ${{ matrix.codex-version }}
        shell: pwsh
        run: |
          $node = (node --version).Trim()
          $npm = (npm --version).Trim()
          $codex = (codex --version | Out-String).Trim()
          if ($node -ne "v26.13.0") { throw "Expected Node v26.13.0, got $node" }
          if ($npm -ne "11.20.0") { throw "Expected npm 11.20.0, got $npm" }
          if ($codex -notmatch [regex]::Escape($env:CODEX_VERSION)) { throw "Expected Codex $env:CODEX_VERSION, got $codex" }
          codex --help | Out-Null
          Write-Host "Verified Node=$node npm=$npm Codex=$codex"

  windows-storage-regressions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify the adaptive context bridge in Windows PowerShell 5.1
        shell: powershell
        run: '& "$env:GITHUB_WORKSPACE\tests\test_ollama_context_bridge.ps1"'
      - name: Verify PowerShell-to-Python Ollama context selection through an explicit file
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE "app\ollama_context.py"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw "Shared Ollama context selector is missing: $helper" }
          $payload = @{
            model_info = @{
              "llama.context_length" = 131072
              "llama.block_count" = 32
              "llama.attention.head_count_kv" = 8
              "llama.attention.key_length" = 128
              "llama.attention.value_length" = 128
            }
            architecture = "llama"
            model_weight_bytes = 5368709120
            available_memory_bytes = 21474836480
            requested_context_tokens = 100000
          } | ConvertTo-Json -Depth 10 -Compress
          $inputFile = Join-Path $env:TEMP ("ollama-context-" + [guid]::NewGuid().ToString("N") + ".json")
          try {
            [System.IO.File]::WriteAllText($inputFile, $payload, [System.Text.UTF8Encoding]::new($false))
            $selectionOutput = & python $helper --input-file $inputFile
            if ($LASTEXITCODE -ne 0) { throw "Explicit-file context selection failed: $($selectionOutput -join ' ')" }
            $selection = ($selectionOutput -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
            if ([int64]$selection.selected_context_tokens -ne 86016) {
              throw "Expected exact safe context 86016, received '$($selection.selected_context_tokens)'."
            }
            if ([int64]$selection.selected_context_tokens -gt [int64]$selection.requested_context_tokens) {
              throw "Selected context exceeded the requested context."
            }
          } finally {
            if (Test-Path -LiteralPath $inputFile) { Remove-Item -LiteralPath $inputFile -Force }
          }
          Write-Host "PowerShell-to-Python explicit-file context bridge passed."
      - name: Run real checkpoint watcher startup, stop, and recovery on Windows
        run: >-
          python -m pytest -q
          tests/test_autonomous_engineering_cycle.py
          tests/test_autonomous_engineering_checkpoint_recovery.py
          -k real_process
      - name: Run checkpoint ownership and recovery fault injection on Windows
        run: >-
          python -m pytest -q
          tests/test_autonomous_engineering_checkpoint_process.py
          tests/test_autonomous_engineering_execution_lock.py
          tests/test_autonomous_engineering_checkpoint_recovery.py
          tests/test_autonomous_engineering_state_lock.py
          tests/test_autonomous_engineering_pending_task_state.py
          tests/test_autonomous_engineering_pending_pr_state.py
          -k "not real_process"
      - name: Verify repository lock exclusion across Windows processes
        run: python -m pytest -q tests/test_autonomous_engineering_cycle.py -k repository_execution_lock
      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath scripts -File -Recurse | Where-Object { $_.Extension -in @(".ps1", ".psm1") }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell scripts/modules successfully."
      - name: Test SQLite migration, restore, and staging cleanup on Windows
        run: >-
          python -m pytest -q
          tests/test_schema_registry.py::test_observed_legacy_learning_schema_migrates_with_backup_and_row_preservation
          tests/test_schema_registry.py::test_legacy_learning_migration_failure_preserves_original_database_bytes
          tests/test_schema_registry.py::test_application_database_initializer_migrates_observed_legacy_learning_store
          tests/test_schema_registry.py::test_restore_backup_requires_opt_in_to_replace_and_restores_verified_file
          tests/test_storage_routes.py::test_restore_staging_cleanup_previews_and_deletes_only_old_verified_snapshots
