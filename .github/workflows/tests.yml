name: tests

on:
  push:
    branches:
      - main
      - feat/experience-learning-loop-v1
  pull_request:
    branches:
      - main
      - feat/rag-source-index-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
