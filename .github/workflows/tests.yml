name: tests
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -vv --durations=25 -o faulthandler_timeout=60
      - name: Verify generated learning artifacts
        run: python scripts/generate_learning_artifacts.py --check
      - name: Validate repository-local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Enforce no module-time Python import cycles
        run: python scripts/check_import_cycles.py --fail-on-cycle
      - name: Run deterministic lexical retrieval benchmark
        run: python scripts/evaluate_experience_retrieval.py --lexical-only
      - name: Run fail-closed claim-to-test coverage benchmark
        run: python scripts/run_knowledge_acceptance_eval.py

  windows-storage-regressions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test SQLite migration, restore, and staging cleanup on Windows
        run: >-
          python -m pytest -q
          tests/test_schema_registry.py::test_observed_legacy_learning_schema_migrates_with_backup_and_row_preservation
          tests/test_schema_registry.py::test_legacy_learning_migration_failure_preserves_original_database_bytes
          tests/test_schema_registry.py::test_application_database_initializer_migrates_observed_legacy_learning_store
          tests/test_schema_registry.py::test_restore_backup_requires_opt_in_to_replace_and_restores_verified_file
          tests/test_storage_routes.py::test_restore_staging_cleanup_previews_and_deletes_only_old_verified_snapshots
