name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Unit tests mock public web retrieval; live integration is opt-in and tested separately.
      LEARNING_AUTO_WEB_RESEARCH: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Report Python import-cycle components
        run: python scripts/check_import_cycles.py
      - name: Run deterministic lexical retrieval benchmark
        run: python scripts/evaluate_experience_retrieval.py --lexical-only

  windows-storage-regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test SQLite migration, restore, and staging cleanup on Windows
        run: >-
          python -m pytest -q
          tests/test_schema_registry.py::test_observed_legacy_learning_schema_migrates_with_backup_and_row_preservation
          tests/test_schema_registry.py::test_legacy_learning_migration_failure_preserves_original_database_bytes
          tests/test_schema_registry.py::test_application_database_initializer_migrates_observed_legacy_learning_store
          tests/test_schema_registry.py::test_restore_backup_requires_opt_in_to_replace_and_restores_verified_file
          tests/test_storage_routes.py::test_restore_staging_cleanup_previews_and_deletes_only_old_verified_snapshots
