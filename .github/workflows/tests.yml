name: tests
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  push:
    branches: [main, fix/codex-builtin-ollama-config-20261110]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run focused checkpoint ownership and concurrency regressions
        run: python -m pytest -vv tests/test_autonomous_engineering_cycle.py -k "checkpoint or repository_execution_lock"
      - name: Run test suite
        run: pytest -vv --durations=25 -o faulthandler_timeout=60
      - name: Verify generated learning artifacts
        run: python scripts/generate_learning_artifacts.py --check
      - name: Validate repository-local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Enforce no module-time Python import cycles
        run: python scripts/check_import_cycles.py --fail-on-cycle
      - name: Run deterministic lexical retrieval benchmark
        run: python scripts/evaluate_experience_retrieval.py --lexical-only
      - name: Run fail-closed claim-to-test coverage benchmark
        run: python scripts/run_knowledge_acceptance_eval.py

  windows-storage-regressions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run real checkpoint watcher integration on Windows
        run: python -m pytest -q tests/test_autonomous_engineering_cycle.py -k real_process
      - name: Verify PowerShell-to-Python Ollama context selection
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE "app\ollama_context.py"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "Shared Ollama context selector is missing: $helper"
          }
          $payload = @{
            model_info = @{
              "llama.context_length" = 131072
              "llama.block_count" = 32
              "llama.attention.head_count_kv" = 8
              "llama.attention.key_length" = 128
              "llama.attention.value_length" = 128
            }
            architecture = "llama"
            model_weight_bytes = 5368709120
            available_memory_bytes = 21474836480
            requested_context_tokens = 100000
          } | ConvertTo-Json -Depth 10 -Compress
          $selectionOutput = $payload | & python $helper
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell-to-Python context selection failed: $($selectionOutput -join ' ')"
          }
          try {
            $selection = ($selectionOutput -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "The shared context selector returned invalid JSON: $($_.Exception.Message)"
          }
          if ([int64]$selection.selected_context_tokens -ne 86016) {
            throw "Expected exact safe context 86016, received '$($selection.selected_context_tokens)'."
          }
          if ([int64]$selection.selected_context_tokens -gt [int64]$selection.requested_context_tokens) {
            throw "The selected context exceeded the explicitly requested context."
          }
          Write-Host "PowerShell-to-Python context bridge passed: $($selection.selected_context_tokens) tokens."
      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell scripts successfully."
      - name: Test SQLite migration, restore, and staging cleanup on Windows
        run: >-
          python -m pytest -q
          tests/test_schema_registry.py::test_observed_legacy_learning_schema_migrates_with_backup_and_row_preservation
          tests/test_schema_registry.py::test_legacy_learning_migration_failure_preserves_original_database_bytes
          tests/test_schema_registry.py::test_application_database_initializer_migrates_observed_legacy_learning_store
          tests/test_schema_registry.py::test_restore_backup_requires_opt_in_to_replace_and_restores_verified_file
          tests/test_storage_routes.py::test_restore_staging_cleanup_previews_and_deletes_only_old_verified_snapshots
