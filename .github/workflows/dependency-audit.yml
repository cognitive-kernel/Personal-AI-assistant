name: dependency-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Upgrade build tooling to patched releases
        run: python -m pip install --upgrade "setuptools>=83.0.0,<84"
      - name: Audit resolved Python environment
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable --progress-spinner off
