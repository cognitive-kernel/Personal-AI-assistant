name: Sandbox integration CI

on:
  pull_request:
    paths:
      - "app/sandbox.py"
      - "app/sandbox_tasks.py"
      - "app/self_improvement.py"
      - "tests/test_sandbox.py"
      - "tests/test_self_improvement.py"
      - "tests/test_sandbox_integration.py"
      - "docker/self-improvement-test-runner.Dockerfile"
      - ".github/workflows/sandbox-integration-ci.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "app/sandbox.py"
      - "app/sandbox_tasks.py"
      - "app/self_improvement.py"
      - "tests/test_sandbox.py"
      - "tests/test_self_improvement.py"
      - "tests/test_sandbox_integration.py"
      - "docker/self-improvement-test-runner.Dockerfile"
      - ".github/workflows/sandbox-integration-ci.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  real-docker-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Official Docker Hub Python image, pinned to the linux/amd64 manifest digest.
      SANDBOX_PYTHON_IMAGE: python:3.11-slim@sha256:922f47525757de33aff59f24cdfc85f412ac4a06aa8af7c7e9028d584b7bcdeb
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate pinned image reference
        run: |
          python - <<'PY'
          import os
          import re

          image = os.environ["SANDBOX_PYTHON_IMAGE"]
          pattern = r"python:3\.11-slim@sha256:[0-9a-f]{64}"
          if not re.fullmatch(pattern, image):
              raise SystemExit("Sandbox CI image must remain an official, digest-pinned Python 3.11 image.")
          PY

      - name: Pull the exact image digest
        run: |
          docker pull "$SANDBOX_PYTHON_IMAGE"
          echo "SANDBOX_DOCKER_EXECUTABLE=$(command -v docker)" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build isolated behavior-test image
        run: |
          docker build \
            --build-arg PYTHON_BASE="$SANDBOX_PYTHON_IMAGE" \
            -f docker/self-improvement-test-runner.Dockerfile \
            -t personal-ai-assistant-test-runner:ci .

      - name: Run full test suite inside isolated Docker
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from app import sandbox

          image = subprocess.run(
              ["docker", "image", "inspect", "--format={{.Id}}", "personal-ai-assistant-test-runner:ci"],
              check=True, capture_output=True, text=True, timeout=10,
          ).stdout.strip()
          docker = shutil.which("docker")
          if not docker:
              raise SystemExit("Docker executable was not found.")
          result = sandbox.run_workspace_tests(
              Path.cwd(), docker_executable=docker, image=image,
              timeout_seconds=240, max_output_bytes=65536,
          )
          print(result.stdout)
          if result.stderr:
              print(result.stderr, file=sys.stderr)
          if result.status != "succeeded":
              raise SystemExit(f"Isolated behavior tests failed: {result.status}: {result.reason or result.exit_code}")

      - name: Run real Docker sandbox integration tests
        env:
          RUN_SANDBOX_INTEGRATION: "1"
        run: python -m pytest -m sandbox_integration -q
