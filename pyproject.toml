[build-system]
requires = ["setuptools>=83.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "Local-first personal AI assistant with isolated learning storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "psutil>=5.9,<8.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0", "httpx>=0.27,<1.0", "httpx2>=2.0,<3.0"]
browser = ["playwright>=1.50,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["sandbox_integration: requires Docker and a preloaded digest-pinned Python image"]

[tool.setuptools.packages.find]
include = ["app*"]
